name: NeuroScene Android APK preview (no emulator)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neuroscene-android-apk-preview
  cancel-in-progress: true

jobs:
  build-android-apk:
    name: Build standalone Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
      EXPO_PUBLIC_VK_CLIENT_ID: ${{ vars.EXPO_PUBLIC_VK_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ui/full-visual-redesign
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          accept-android-sdk-licenses: true
      - name: Install Android platform and NDK
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"
      - name: Install dependencies
        run: npm ci
      - name: Disable optional Foojay JDK resolver in React Native Gradle plugin
        run: |
          SETTINGS="node_modules/@react-native/gradle-plugin/settings.gradle.kts"
          test -f "$SETTINGS"
          if grep -q "foojay-resolver-convention" "$SETTINGS"; then
            sed -i '/foojay-resolver-convention/d' "$SETTINGS"
          fi
          if grep -q "foojay-resolver-convention" "$SETTINGS"; then
            echo "Foojay resolver reference was not removed" >&2
            exit 1
          fi
          echo "Using the JDK 17 installed by actions/setup-java"
      - name: TypeScript validation (report existing app typing issues)
        run: npx tsc --noEmit
        continue-on-error: true
      - name: Set up Pillow for launcher artwork
        run: |
          python3 -m venv .venv
          .venv/bin/pip install Pillow
      - name: Fit launcher logo inside Android safe area
        run: .venv/bin/python scripts/fit-android-icon.py
      - name: Validate Expo launcher and splash assets
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const config = JSON.parse(fs.readFileSync('app.json', 'utf8')).expo;
          const splash = config.plugins.find((plugin) => Array.isArray(plugin) && plugin[0] === 'expo-splash-screen');
          const references = [
            config.icon,
            config.android?.adaptiveIcon?.foregroundImage,
            splash?.[1]?.image,
            config.web?.favicon,
          ].filter(Boolean);
          for (const reference of references) {
            const assetPath = path.resolve(reference.replace(/^\.\//, ''));
            if (!fs.existsSync(assetPath)) {
              throw new Error('Expo asset is missing: ' + reference);
            }
            const image = fs.readFileSync(assetPath);
            const signature = image.subarray(0, 8).toString('hex');
            if (signature !== '89504e470d0a1a0a') {
              throw new Error('Expo asset is not a valid PNG: ' + reference);
            }
            const width = image.readUInt32BE(16);
            const height = image.readUInt32BE(20);
            if (width !== 1024 || height !== 1024) {
              throw new Error('Expo launcher artwork must be 1024x1024: ' + reference + ' (' + width + 'x' + height + ')');
            }
            console.log('Validated ' + reference + ' (' + width + 'x' + height + ')');
          }
          if (!config.android?.adaptiveIcon?.foregroundImage?.endsWith('android-icon-foreground.png')) {
            throw new Error('Adaptive icon must use the generated safe-area foreground asset');
          }
          NODE
      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install --clean
      - name: Build standalone installable APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleRelease
      - name: Verify APK and embedded JavaScript
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          unzip -l "$APK" | grep -E 'assets/index.android.bundle'
          ls -lh "$APK"
          file "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: neurosScene-preview-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7
