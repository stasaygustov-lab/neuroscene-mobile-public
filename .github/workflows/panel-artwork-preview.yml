name: Export reference artwork
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Convert PNG to JPEG
        run: |
          python -m pip install --quiet Pillow
          python - <<'PY'
          from PIL import Image
          from pathlib import Path

          source = Path("assets/Космическая панель технологий.png")
          if not source.is_file():
              raise SystemExit(f"Source image not found: {source}")
          image = Image.open(source).convert("RGB")
          image.thumbnail((2400, 2400), Image.Resampling.LANCZOS)
          output = Path("panel-reference.jpg")
          image.save(output, "JPEG", quality=92, optimize=True)
          print(f"Created {output}: {image.width}x{image.height}")
          PY
      - name: Upload reference image
        uses: actions/upload-artifact@v4
        with:
          name: panel-reference
          path: panel-reference.jpg
          if-no-files-found: error
          retention-days: 3
