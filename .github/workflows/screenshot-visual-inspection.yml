name: NeuroScene screenshot visual inspection

on:
  push:
    branches:
      - ui/full-screen-rebuild-html-reference

permissions:
  contents: read

jobs:
  prepare-screenshot-preview:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ui/full-screen-rebuild-html-reference
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build compact screenshot contact sheet
        run: |
          python -m pip install --quiet Pillow
          python - <<'PY'
          from PIL import Image, ImageOps, ImageDraw
          from pathlib import Path
          import io, base64
          files = sorted(Path("screenshots").glob("Screenshot-*.jpg"))
          if not files:
              raise SystemExit("No screenshots found in screenshots/")
          tile_w, tile_h, gap, header = 420, 820, 18, 34
          cols = 2
          rows = (len(files) + cols - 1) // cols
          sheet = Image.new("RGB", (cols*tile_w+(cols+1)*gap, rows*(tile_h+header)+(rows+1)*gap), "#10141d")
          draw = ImageDraw.Draw(sheet)
          for i, path in enumerate(files):
              im = Image.open(path).convert("RGB")
              im.thumbnail((tile_w, tile_h), Image.Resampling.LANCZOS)
              tile = Image.new("RGB", (tile_w, tile_h), "#202938")
              tile.paste(im, ((tile_w-im.width)//2, (tile_h-im.height)//2))
              x = gap + (i % cols)*(tile_w+gap)
              y = gap + (i // cols)*(tile_h+header+gap)
              sheet.paste(tile, (x, y+header))
              draw.text((x+6, y+9), path.name, fill="white")
          out = io.BytesIO()
          sheet.save(out, format="JPEG", quality=62, optimize=True)
          encoded = base64.b64encode(out.getvalue()).decode("ascii")
          print("SCREENSHOT_SHEET_BASE64_BEGIN")
          print(encoded)
          print("SCREENSHOT_SHEET_BASE64_END")
          print(f"Processed {len(files)} screenshots; contact sheet {sheet.size[0]}x{sheet.size[1]}; {len(out.getvalue())} bytes.")
          PY
