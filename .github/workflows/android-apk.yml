# Android UI smoke test uses POSIX-compatible shell for emulator runner.
name: NeuroScene Android APK and UI smoke test

on:
  push:
    branches: [main, fix/android-lan-backend-url-2026-11-26]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neuroscene-android-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-backend-auth-smoke:
    name: Verify local Backend test login on PC runner
    if: github.ref == 'refs/heads/fix/android-lan-backend-url-2026-11-26' || github.head_ref == 'fix/android-lan-backend-url-2026-11-26'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 3
    env:
      NEUROSCENE_API_BASE_URL: ${{ vars.NEUROSCENE_LOCAL_API_URL || 'http://127.0.0.1:8000' }}
    steps:
      - name: Call local test-login endpoint and validate response shape
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $uri = "$($env:NEUROSCENE_API_BASE_URL.TrimEnd('/'))/api/auth/local-test"
          $client = [System.Net.Http.HttpClient]::new()
          try {
            $request = [System.Net.Http.HttpRequestMessage]::new([System.Net.Http.HttpMethod]::Post, $uri)
            $request.Headers.Accept.ParseAdd('application/json')
            $response = $client.SendAsync($request).GetAwaiter().GetResult()
            $body = $response.Content.ReadAsStringAsync().GetAwaiter().GetResult()
            Write-Host "Endpoint: $uri"
            Write-Host "HTTP status: $([int]$response.StatusCode)"
            if (-not $response.IsSuccessStatusCode) {
              Write-Host "Backend error response: $body"
              throw "Local test-login request failed."
            }
            $data = $body | ConvertFrom-Json
            $fields = @($data.PSObject.Properties.Name)
            Write-Host "Response fields: $($fields -join ', ')"
            $hasToken = $fields -contains 'access_token' -and -not [string]::IsNullOrWhiteSpace([string]$data.access_token)
            $hasUser = $fields -contains 'user' -and $null -ne $data.user
            Write-Host "access_token present: $hasToken"
            Write-Host "user present: $hasUser"
            if (-not ($hasToken -and $hasUser)) {
              throw "Backend response does not match the mobile app session contract."
            }
            Write-Host 'Local test-login response matches the mobile app contract.'
          }
          finally {
            $client.Dispose()
          }

  build-android-apk:
    name: Build standalone Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL || 'http://192.168.0.175:8000' }}
      EXPO_PUBLIC_LOCAL_TEST_MODE: ${{ github.ref == 'refs/heads/fix/android-lan-backend-url-2026-11-26' || github.head_ref == 'fix/android-lan-backend-url-2026-11-26' }}
      EXPO_PUBLIC_VK_CLIENT_ID: ${{ vars.EXPO_PUBLIC_VK_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          accept-android-sdk-licenses: true
      - name: Install Android platform and NDK
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"
      - run: npm ci
      - name: Fit launcher logo inside Android safe area
        run: |
          python3 -m venv .venv
          .venv/bin/pip install Pillow
          .venv/bin/python scripts/fit-android-icon.py
      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install --clean
      - name: Build standalone installable APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleRelease
      - name: Verify standalone APK and embedded JavaScript
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          unzip -l "$APK" | grep -E 'assets/index.android.bundle'
          ls -lh "$APK"
          file "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: neurosScene-preview-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7

  visual-smoke-test:
    name: Capture Android UI screens
    needs: build-android-apk
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: neurosScene-preview-apk
          path: artifacts
      - name: Start Android emulator and capture screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -camera-back none -camera-front none
          disable-animations: true
          emulator-boot-timeout: 600
          script: |
            set -eu
            adb wait-for-device
            adb install -r artifacts/app-release.apk
            adb shell monkey -p com.neuroscene.app -c android.intent.category.LAUNCHER 1
            python3 scripts/capture-android-screens.py
      - uses: actions/upload-artifact@v4
        with:
          name: neurosScene-visual-screenshots
          path: screenshots/*.png
          if-no-files-found: error
          retention-days: 7
