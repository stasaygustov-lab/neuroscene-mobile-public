# Android UI smoke test uses POSIX-compatible shell for emulator runner.
name: NeuroScene Android APK and UI smoke test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android-apk:
    name: Build standalone Android APK
    runs-on: ubuntu-24.04
    env:
      EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
      EXPO_PUBLIC_VK_CLIENT_ID: ${{ vars.EXPO_PUBLIC_VK_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          accept-android-sdk-licenses: true
      - name: Install Android platform and NDK
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"
      - run: npm ci
      - name: Fit launcher logo inside Android safe area
        run: |
          python3 -m venv .venv
          .venv/bin/pip install Pillow
          .venv/bin/python scripts/fit-android-icon.py
      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install --clean
      - name: Build standalone installable APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleRelease
      - name: Verify standalone APK and embedded JavaScript
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          unzip -l "$APK" | grep -E 'assets/index.android.bundle'
          ls -lh "$APK"
          file "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: neurosScene-preview-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7

  visual-smoke-test:
    name: Capture Android UI screens
    needs: build-android-apk
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: neurosScene-preview-apk
          path: artifacts
      - name: Start Android emulator and capture screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -camera-back none -camera-front none
          emulator-boot-timeout: 900
          script: |
            set -eu
            mkdir -p screenshots
            adb install artifacts/app-release.apk
            adb shell monkey -p com.neuroscene.app -c android.intent.category.LAUNCHER 1
            sleep 1
            adb shell screencap -p /sdcard/splash.png
            adb pull /sdcard/splash.png screenshots/00-splash.png
            sleep 5
            adb shell screencap -p /sdcard/create.png
            adb pull /sdcard/create.png screenshots/01-create.png

            python3 - <<'PY'
            import subprocess, time, xml.etree.ElementTree as ET, re

            def run(args, timeout=45, **kwargs):
              return subprocess.run(args, check=True, timeout=timeout, **kwargs)

            def screen_size():
              value = subprocess.check_output(["adb", "shell", "wm", "size"], text=True, timeout=15)
              match = re.search(r"(\d+)x(\d+)", value)
              if not match:
                raise RuntimeError(f"Cannot read emulator screen size: {value}")
              return int(match.group(1)), int(match.group(2))

            width, height = screen_size()

            def hierarchy():
              run(["adb", "shell", "uiautomator", "dump", "/sdcard/window.xml"], timeout=50, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
              raw = subprocess.check_output(["adb", "shell", "cat", "/sdcard/window.xml"], text=True, timeout=15)
              return ET.fromstring(raw)

            def tap_text(label, fallback_x, fallback_y):
              try:
                root = hierarchy()
                candidates = [n for n in root.iter("node") if n.attrib.get("text") == label or n.attrib.get("content-desc") == label]
                if candidates:
                  b = list(map(int, candidates[0].attrib["bounds"].replace("][", ",").strip("[]").split(",")))
                  run(["adb", "shell", "input", "tap", str((b[0]+b[2])//2), str((b[1]+b[3])//2)], timeout=15)
                  return
              except Exception as exc:
                print(f"Accessibility lookup for {label!r} unavailable: {exc}")
              run(["adb", "shell", "input", "tap", str(fallback_x), str(fallback_y)], timeout=15)

            nav_y = height - 180
            tabs = [("Галерея", 1), ("Кредиты", 2), ("Профиль", 3)]
            for label, index in tabs:
              x = width * (2 * index + 1) // 8
              tap_text(label, x, nav_y)
              time.sleep(3)
              filename = {"Галерея":"02-gallery.png", "Кредиты":"03-credits.png", "Профиль":"04-profile.png"}[label]
              run(["adb", "shell", "screencap", "-p", f"/sdcard/{filename}"])
              run(["adb", "pull", f"/sdcard/{filename}", f"screenshots/{filename}"])
              if label == "Кредиты":
                tap_text("Назад", 55, 135)
                time.sleep(2)
              if label == "Профиль":
                tap_text("Войти по email", width // 2, int(height * 0.70))
                time.sleep(2)
                run(["adb", "shell", "screencap", "-p", "/sdcard/05-email-login.png"])
                run(["adb", "pull", "/sdcard/05-email-login.png", "screenshots/05-email-login.png"])
            PY
      - uses: actions/upload-artifact@v4
        with:
          name: neurosScene-visual-screenshots
          path: screenshots/*.png
          if-no-files-found: error
          retention-days: 7
