# Android UI smoke test uses POSIX-compatible shell for emulator runner.
name: NeuroScene Android APK and UI smoke test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neuroscene-android-validation
  cancel-in-progress: true

jobs:
  build-android-apk:
    name: Build standalone Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
      EXPO_PUBLIC_VK_CLIENT_ID: ${{ vars.EXPO_PUBLIC_VK_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          accept-android-sdk-licenses: true
      - name: Install Android platform and NDK
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"
      - run: npm ci
      - name: Fit launcher logo inside Android safe area
        run: |
          python3 -m venv .venv
          .venv/bin/pip install Pillow
          .venv/bin/python scripts/fit-android-icon.py
      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install --clean
      - name: Build standalone installable APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleRelease
      - name: Verify standalone APK and embedded JavaScript
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          unzip -l "$APK" | grep -E 'assets/index.android.bundle'
          ls -lh "$APK"
          file "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: neurosScene-preview-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7

  visual-smoke-test:
    name: Capture Android UI screens
    needs: build-android-apk
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: neurosScene-preview-apk
          path: artifacts
      - name: Start Android emulator and capture screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -camera-back none -camera-front none
          disable-animations: true
          emulator-boot-timeout: 600
          script: |
            set -eu
            adb wait-for-device
            adb logcat -c
            adb install -r artifacts/app-release.apk
            adb shell monkey -p com.neuroscene.app -c android.intent.category.LAUNCHER 1
            sleep 15
            if ! adb shell pidof com.neuroscene.app >/dev/null; then
              echo "NeuroScene process exited after launch"
              adb logcat -d
              exit 1
            fi
            if adb logcat -d -s AndroidRuntime:E | grep -E 'FATAL EXCEPTION|Process: com.neuroscene.app'; then
              echo "Fatal Android runtime exception detected"
              exit 1
            fi
            python3 scripts/capture-android-screens.py
      - uses: actions/upload-artifact@v4
        with:
          name: neurosScene-visual-screenshots
          path: screenshots/*.png
          if-no-files-found: error
          retention-days: 7
