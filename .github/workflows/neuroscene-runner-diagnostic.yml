name: NeuroScene Runner Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-local-pc:
    name: Diagnose NeuroScene PC
    runs-on: [self-hosted, Windows, X64, neuroscene]
    timeout-minutes: 5
    steps:
      - name: Confirm runner and Windows environment
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Write-Host "Runner: $env:RUNNER_NAME"
          Write-Host "OS: $env:RUNNER_OS"
          Write-Host "Architecture: $env:RUNNER_ARCH"
          Write-Host "Workspace: $env:GITHUB_WORKSPACE"
          if ($env:RUNNER_OS -ne "Windows") { throw "Expected Windows runner" }

      - name: Check local MP4 and FFprobe
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $video = "E:\NeuroSceneInstall\source\repository\backend\runtime\media\80bbfc9f-03ed-4fe7-8ab9-acfd1313bfa7.mp4"
          $ffprobe = "E:\NeuroSceneInstall\ffmpeg\bin\ffprobe.exe"
          if (-not (Test-Path -LiteralPath $video -PathType Leaf)) {
            throw "Expected diagnostic MP4 was not found: $video"
          }
          if (-not (Test-Path -LiteralPath $ffprobe -PathType Leaf)) {
            throw "FFprobe was not found: $ffprobe"
          }
          $file = Get-Item -LiteralPath $video
          Write-Host ("MP4 exists; size: {0} bytes" -f $file.Length)
          & $ffprobe -v error -show_entries "format=duration:stream=codec_name,codec_type,width,height,pix_fmt,r_frame_rate" -of json $video
          if ($LASTEXITCODE -ne 0) { throw "FFprobe failed with exit code $LASTEXITCODE" }
